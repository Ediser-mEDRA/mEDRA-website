backend:
  name: github
  repo: Ediser-mEDRA/mEDRA-website
  branch: develop
  base_url: https://www-medra-dev.medra.org
  auth_endpoint: auth
  #causes all commits to be “squashed” into a single commit when the pull request is merged
  squash_merges: true

local_backend: true
display_url: https://ediser-medra.github.io/mEDRA-website

logo:
  src: https://ediser-medra.github.io/mEDRA-website/images/medra-without-text-logo-removebg-preview.png
  show_in_header: true
  
publish_mode: editorial_workflow

media_folder: "static/images/uploads"
public_folder: "/images/uploads"

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

#i18n:
  #structure: multiple_folders
  #locales: [de, en, it]
  #default_locale: en
  
collections:
  # --- SECTIONS (content/<locale>/<section>/_index.md) ---
  - name: "sections_en"
    label: "Sections (EN)"
    folder: "content/en"
    path: "{{slug}}"
    create: true
    #i18n:
      #structure: multiple_folders
      #locales: [de, en, it]
      #default_locale: en
    fields: [
       { label: "Title", name: "title", widget: "string" },
       { label: "Description", name: "description", widget: "string" },
       { label: "Weight", name: "weight", widget: "number" },
       { label: "Draft", name: "draft", widget: "boolean", default: false },
       { label: "Date", name: "date", widget: "datetime", required: false, default: "{{now}}" },
       { label: "Author", name: "author", widget: "string", required: false },
      ]
    # Add nested and meta objects
    nested:
      depth: 2
      summary: "{{title}}"
      subfolders: true
    meta:
      path:
        widget: string
        label: "Path"
        index_file: "_index"

  # --- SECTIONS (content/<locale>/<section>/_index.md) ---
  - name: "sections_it"
    label: "Sections (IT)"
    folder: "content/it"
    #path: "{{slug}}/_index"
    create: true
    #i18n:
      #structure: multiple_folders
      #locales: [de, en, it]
      #default_locale: en
    fields: [
       { label: "Title", name: "title", widget: "string" },
       { label: "Description", name: "description", widget: "string" },
       { label: "Weight", name: "weight", widget: "number" },
       { label: "Draft", name: "draft", widget: "boolean", default: false },
       { label: "Date", name: "date", widget: "datetime", required: false, default: "{{now}}" },
       { label: "Author", name: "author", widget: "string", required: false },
      ]
    # Add nested and meta objects
    nested:
      depth: 2
      summary: "{{title}}"
      subfolders: true
    meta:
      path:
        widget: string
        label: "Path"
        index_file: "_index"

  # --- SECTIONS (content/<locale>/<section>/_index.md) ---
  - name: "sections_de"
    label: "Sections (DE)"
    folder: "content/de"
    #path: "{{slug}}/_index"
    create: true
    #i18n:
      #structure: multiple_folders
      #locales: [de, en, it]
      #default_locale: en
    fields: [
       { label: "Title", name: "title", widget: "string" },
       { label: "Description", name: "description", widget: "string" },
       { label: "Weight", name: "weight", widget: "number" },
       { label: "Draft", name: "draft", widget: "boolean", default: false },
       { label: "Date", name: "date", widget: "datetime", required: false, default: "{{now}}" },
       { label: "Author", name: "author", widget: "string", required: false },
      ]
    # Add nested and meta objects
    nested:
      depth: 2
      summary: "{{title}}"
      subfolders: true
    meta:
      path:
        widget: string
        label: "Path"
        index_file: "_index"
        
  # --- SUBSECTIONS (content/<locale>/<section>/<subsection>/**/_index.md) ---
  - name: "subsections_en"
    label: "Subsections (EN)"
    folder: "content"
    path: "{{fields.sections_en}}/_index"
    create: true
    #i18n:
      #structure: multiple_folders
      #locales: [de, en, it]
      #default_locale: en
    fields: [
      { label: "Parent Section", name: "section", widget: "relation", collection: "sections_en", search_fields: ["title"], display_fields: ["title"], value_field: "{{slug}}", required: true },
      { label: "Title", name: "title", widget: "string" },
      { label: "Description", name: "description", widget: "string" },
      { label: "Weight", name: "weight", widget: "number" },
      { label: "Draft", name: "draft", widget: "boolean", default: false },
      { label: "Date", name: "date", widget: "datetime", required: false, default: "{{now}}" },
      { label: "Author", name: "author", widget: "string", required: false },
    ]
    # Add nested and meta objects
    nested:
      depth: 3
      summary: "{{title}}"
      subfolders: true
    #meta: { path: { widget: string, label: 'Path', index_file: '_index' } }
    
  - name: "subsections_it"
    label: "Subsections (IT)"
    folder: "content"
    path: "{{fields.sections_it}}/_index"
    create: true
    #i18n:
      #structure: multiple_folders
      #locales: [de, en, it]
      #default_locale: en
    fields: [
      { label: "Parent Section", name: "section", widget: "relation", collection: "sections_it", search_fields: ["title"], display_fields: ["title"], value_field: "{{slug}}", required: true },
      { label: "Title", name: "title", widget: "string" },
      { label: "Description", name: "description", widget: "string" },
      { label: "Weight", name: "weight", widget: "number" },
      { label: "Draft", name: "draft", widget: "boolean", default: false },
      { label: "Date", name: "date", widget: "datetime", required: false, default: "{{now}}" },
      { label: "Author", name: "author", widget: "string", required: false },
    ]
    # Add nested and meta objects
    nested:
      depth: 3
      summary: "{{title}}"
      subfolders: true
    #meta: { path: { widget: string, label: 'Path', index_file: '_index' } }
    
  - name: pages
    label: "Pages"
    folder: "content"
    path: "{{slug}}"
    create: true
    i18n: true
    #  structure: multiple_files
    #  locales: [de, en, it]
    fields: [
       { label: "Title", name: "title", widget: "string", i18n: true },
       { label: "Description", name: "description", widget: "string", required: false, i18n: true },
       { label: "Weight", name: "weight", widget: "number", i18n: duplicate },
       { label: "Draft", name: "draft", widget: "boolean", default: false, i18n: true },
       { label: "Date", name: "date", widget: "datetime", required: false, default: "{{now}}", i18n: true },
       { label: "Content", name: "body", widget: "markdown", i18n: true },
       { label: "Author", name: "author", widget: "string", required: true, i18n: true },
    ]
    nested:
      depth: 10
      summary: "{{title}}"
      subfolders: false   # pages are leaf files, they don't have their own children
    meta:
      path:
        widget: "string"
        label: "Path (es. about-medra/team or about-medra/resources/team)"
        required: true
    
