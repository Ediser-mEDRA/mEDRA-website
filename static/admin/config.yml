backend:
  name: github
  repo: Ediser-mEDRA/mEDRA-website
  branch: develop
  base_url: https://www-medra-dev.medra.org
  auth_endpoint: auth
  
  # Enable editorial workflow for content review
  #cms_label_prefix: "decap-cms/"

#local_backend: true
display_url: https://ediser-medra.github.io/mEDRA-website

logo:
  src: https://ediser-medra.github.io/mEDRA-website/images/medra-without-text-logo-removebg-preview.png
  show_in_header: true
  
publish_mode: editorial_workflow

media_folder: "static/images/uploads"
public_folder: "/images/uploads"

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

#i18n:
  #structure: multiple_folders
  #locales: [de, en, it]
  #default_locale: en
  
collections:
  # --- SECTIONS (content/<locale>/<section>/_index.md) ---
  - name: "sections"
    label: "Sections"
    folder: "content/en"
    create: true
    #i18n: true
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: 'Description', name: 'description', widget: 'string' }
      - { label: "Weight", name: "weight", widget: "number" }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Date", name: "date", widget: "datetime", required: false, default: "{{now}}" }
      - { label: "Author", name: "author", widget: "string", required: false }
