backend:
  name: github
  repo: Ediser-mEDRA/mEDRA-website
  branch: develop
  base_url: https://www-medra-dev.medra.org
  auth_endpoint: auth
  squash_merges: true

local_backend: true

display_url: https://ediser-medra.github.io/mEDRA-website

show_preview_links: true
search: true
locale: en

logo:
  src: https://ediser-medra.github.io/mEDRA-website/images/medra-without-text-logo-removebg-preview.png
  show_in_header: true

publish_mode: editorial_workflow

media_folder: "static/images/uploads"
public_folder: "/images/uploads"

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

# ------------------------------------------------------------------
# Shared fields (YAML anchor, reused by every language collection)
# ------------------------------------------------------------------
shared_fields: &shared_fields
  - label: "Content type"
    name: "type"
    widget: "select"
    options:
      - { label: "Section",    value: "section" }
      - { label: "Subsection", value: "subsection" }
      - { label: "Page",       value: "page" }
    default: "page"
    hint: "Sections and subsections should be top-level folders. Pages live inside them."

  - { label: "Title", name: "title", widget: "string" }
  - { label: "Icona Bootstrap", name: "icon", widget: "string", default: "bi-link-45deg", hint: "Es. bi-link-45deg, bi-pencil-square, bi-search, bi-arrow-left-right, bi-quote, bi-code-slash" }
  - { label: "Menu title", name: "menu_title", widget: "string", required: false }
  - { label: "Description", name: "description", widget: "text", required: false }
  - { label: "Translation key", name: "translationKey", widget: "string", required: false, hint: "Use the SAME key across languages to link translations." }
  - { label: "Weight", name: "weight", widget: "number", value_type: "int", default: 10 }
  - { label: "Image", name: "image", widget: "image", required: false }
  - { label: "Draft", name: "draft", widget: "boolean", default: false }
  - { label: "Body", name: "body", widget: "markdown", required: false }

# ------------------------------------------------------------------
# Collections — one per language
# ------------------------------------------------------------------
collections:
  # ENGLISH
  - name: "pages_en"
    label: "English content"
    label_singular: "English entry"
    folder: "content/en"
    create: true
    delete: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"

    nested:
      depth: 100
      summary: "{{title}}  ·  {{type}}"
      subfolders: true
    meta:
      path:
        widget: string
        label: "Parent folder"
        hint: "e.g. 'about/team' — leave empty for top level. The entry is saved as <parent-folder>/<slug>/_index.md"
        index_file: "_index"

    view_filters:
      - label: "Sections only"
        field: type
        pattern: "section"
      - label: "Subsections only"
        field: type
        pattern: "subsection"
      - label: "Pages only"
        field: type
        pattern: "page"

    fields: *shared_fields

  # GERMAN
  - name: "pages_de"
    label: "German content"
    label_singular: "German entry"
    folder: "content/de"
    create: true
    delete: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    nested:
      depth: 100
      summary: "{{title}}  ·  {{type}}"
      subfolders: true
    meta:
      path:
        widget: string
        label: "Parent folder"
        hint: "e.g. 'about/team' — leave empty for top level."
        index_file: "_index"
    view_filters:
      - { label: "Sections only",    field: type, pattern: "section" }
      - { label: "Subsections only", field: type, pattern: "subsection" }
      - { label: "Pages only",       field: type, pattern: "page" }
    fields: *shared_fields

  # ITALIAN
  - name: "pages_it"
    label: "Italian content"
    label_singular: "Italian entry"
    folder: "content/it"
    create: true
    delete: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    nested:
      depth: 100
      summary: "{{title}}  ·  {{type}}"
      subfolders: true
    meta:
      path:
        widget: string
        label: "Parent folder"
        hint: "e.g. 'about/team' — leave empty for top level."
        index_file: "_index"
    view_filters:
      - { label: "Sections only",    field: type, pattern: "section" }
      - { label: "Subsections only", field: type, pattern: "subsection" }
      - { label: "Pages only",       field: type, pattern: "page" }
    fields: *shared_fields
  
  # ================================================================
  # SERVIZI — aggiungi / modifica / riordina
  # ================================================================
  - name: "services"
    label: "Services"
    files:
      - name: "services_en"
        label: "English — Services"
        file: "data/services/en.yaml"
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string", default: "Our Services" }
          - { label: "Titolo sezione", name: "title", widget: "string", default: "Everything you need to manage DOIs" }
          - label: "Services"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Bootstrap Icon", name: "icon", widget: "string", default: "bi-link-45deg", hint: "Es. bi-link-45deg, bi-pencil-square, bi-search, bi-arrow-left-right, bi-quote, bi-code-slash" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Link text", name: "link_text", widget: "string", default: "Get started" }
              - { label: "URL link", name: "link_url", widget: "string" }
      
      - name: "services_it"
        label: "Italiano — Servizi"
        file: "data/services/it.yaml"
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string", default: "I nostri servizi" }
          - { label: "Titolo sezione", name: "title", widget: "string", default: "Tutto ciò di cui hai bisogno per gestire i DOI" }
          - label: "Servizi"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Icona Bootstrap", name: "icon", widget: "string", default: "bi-link-45deg", hint: "Es. bi-link-45deg, bi-pencil-square, bi-search, bi-arrow-left-right, bi-quote, bi-code-slash" }
              - { label: "Titolo", name: "title", widget: "string" }
              - { label: "Descrizione", name: "description", widget: "text" }
              - { label: "Testo link", name: "link_text", widget: "string", default: "Inizia" }
              - { label: "URL link", name: "link_url", widget: "string" }
  
  # NEWS — featured + lista dinamica
  - name: "news"
    label: "News & Announcements"
    files:
      - name: "news_en"
        label: "English — News"
        file: "data/news/en.yaml"
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string", default: "News & Announcements" }
          - { label: "Title section", name: "title", widget: "string", default: "News & Announcements" }
          - { label: "Link 'View all'", name: "view_all_url", widget: "string", required: false }
          - label: "Featured News"
            name: "featured"
            widget: "object"
            fields:
              - { label: "Badge",     name: "badge",     widget: "string", default: "Latest News" }
              - { label: "Date",      name: "date",      widget: "string", hint: "Free text, e.g. 'May 15, 2024'" }
              - { label: "Title",    name: "title",     widget: "string" }
              - { label: "Excerpt",  name: "excerpt",   widget: "text" }
              - { label: "Link text", name: "link_text", widget: "string", default: "Read full notice" }
              - { label: "URL link",   name: "link_url",  widget: "string" }
          - label: "Other News"
            name: "items"
            widget: "list"
            summary: "{{fields.category}} — {{fields.title}}"
            fields:
              - { label: "Category",  name: "category",  widget: "string",
                  hint: "E.g. Tech Update, Compliance, Event, Standards" }
              - { label: "Title",     name: "title",     widget: "string" }
              - { label: "Excerpt",   name: "excerpt",   widget: "text" }
              - { label: "Date",       name: "date",      widget: "string" }
              - { label: "URL",        name: "link_url",  widget: "string" }

      - name: "news_it"
        label: "Italiano — Notizie"
        file: "data/news/it.yaml"
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string", default: "News & Comunicazioni" }
          - { label: "Titolo sezione", name: "title", widget: "string", default: "News & Comunicazioni" }
          - { label: "Link 'View all'", name: "view_all_url", widget: "string", required: false }
          - label: "News in evidenza"
            name: "featured"
            widget: "object"
            fields:
              - { label: "Badge",     name: "badge",     widget: "string", default: "Ultima news" }
              - { label: "Data",      name: "date",      widget: "string" }
              - { label: "Titolo",    name: "title",     widget: "string" }
              - { label: "Estratto",  name: "excerpt",   widget: "text" }
              - { label: "Testo link", name: "link_text", widget: "string", default: "Leggi tutto" }
              - { label: "URL link",   name: "link_url",  widget: "string" }
          - label: "Altre notizie"
            name: "items"
            widget: "list"
            summary: "{{fields.category}} — {{fields.title}}"
            fields:
              - { label: "Categoria",  name: "category",  widget: "string" }
              - { label: "Titolo",     name: "title",     widget: "string" }
              - { label: "Estratto",   name: "excerpt",   widget: "text" }
              - { label: "Data",       name: "date",      widget: "string" }
              - { label: "URL",        name: "link_url",  widget: "string" }
  
  # SETTINGS SITE
  - name: "settings"
    label: "Site settings"
    files:
      - name: "site"
        label: "Topbar, Social, Footer"
        file: "data/site.yaml"
        fields:
          - label: "Topbar"
            name: "topbar"
            widget: "object"
            fields:
              - { label: "Main Email", name: "email", widget: "string" }
              - label: "Social topbar"
                name: "socials"
                widget: "list"
                summary: "{{fields.key}}"
                fields:
                  - { label: "Key (GitHub/linkedin/...)", name: "key", widget: "string" }
                  - { label: "URL", name: "url", widget: "string" }
                  - { label: "Bootstrap Icon", name: "icon", widget: "string", default: "bi-link" }
                  - { label: "Open in new tab", name: "external", widget: "boolean", default: true }
                  - { label: "Divider before", name: "divider", widget: "boolean", required: false, default: false }

          - label: "Footer"
            name: "footer"
            widget: "object"
            fields:
              - label: "Brand — Social"
                name: "brand"
                widget: "object"
                fields:
                  - label: "Social footer"
                    name: "socials"
                    widget: "list"
                    summary: "{{fields.key}}"
                    fields:
                      - { label: "Key", name: "key", widget: "string" }
                      - { label: "URL", name: "url", widget: "string" }
                      - { label: "Icon", name: "icon", widget: "string" }
                      - { label: "Open in new tab", name: "external", widget: "boolean", default: false }
              - label: "Company Data"
                name: "company"
                widget: "object"
                fields:
                  - { label: "Company Name", name: "name", widget: "string" }
                  - { label: "Address", name: "address", widget: "string" }
                  - { label: "VAT Number", name: "vat", widget: "string" }
                  - { label: "Phone", name: "phone", widget: "string" }
                  - { label: "Email", name: "email", widget: "string" }
              - label: "Link Columns"
                name: "columns"
                widget: "list"
                summary: "{{fields.title_key}}"
                fields:
                  - { label: "Title Key (i18n)", name: "title_key", widget: "string" }
                  - label: "Links"
                    name: "links"
                    widget: "list"
                    fields:
                      - { label: "Text Key (i18n)", name: "text_key", widget: "string" }
                      - { label: "URL", name: "url", widget: "string" }
              - label: "Direct Footer Contacts"
                name: "contact"
                widget: "object"
                fields:
                  - { label: "Phone", name: "phone", widget: "string" }
                  - { label: "Email", name: "email", widget: "string" }
              - label: "Bottom Bar Links"
                name: "bottom_links"
                widget: "list"
                fields:
                  - { label: "Text Key (i18n)", name: "text_key", widget: "string" }
                  - { label: "URL", name: "url", widget: "string" }
  
  # ================================================================
  # LANDING — Hero, What is a DOI, Partners
  # ================================================================
  - name: "landing"
    label: "Landing — Hero, DOI, Partners"
    files:
      - name: "landing_en"
        label: "English — Landing"
        file: "data/landing/en.yaml"
        fields:
          # ---------------- HERO ----------------
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Badge — text", name: "badge", widget: "string" }
              - { label: "Badge — icon", name: "badge_icon", widget: "string", default: "bi-check-lg" }
              - { label: "Title — line 1", name: "title_line1", widget: "string" }
              - { label: "Title — line 2 (accent)", name: "title_line2", widget: "string" }
              - { label: "Description (Markdown)", name: "description", widget: "markdown", hint: "You can use **bold** and links." }
              - label: "Primary CTA"
                name: "cta_primary"
                widget: "object"
                fields:
                  - { label: "Text", name: "label", widget: "string" }
                  - { label: "URL", name: "url",   widget: "string" }
                  - { label: "Bootstrap Icon", name: "icon", widget: "string", default: "bi-box-seam" }
              - label: "Secondary CTA"
                name: "cta_secondary"
                widget: "object"
                fields:
                  - { label: "Text", name: "label", widget: "string" }
                  - { label: "URL", name: "url", widget: "string" }
                  - { label: "Bootstrap Icon", name: "icon", widget: "string", default: "bi-info-circle" }
              - label: "Card DOI animate (vertical)"
                name: "cards"
                widget: "list"
                label_singular: "Card DOI"
                summary: "{{fields.id}} — {{fields.status}}"
                hint: "The cards scroll automatically from top to bottom. Add as many as you like."
                fields:
                  - { label: "DOI", name: "id", widget: "string", hint: "e.g. 10.1234" }
                  - { label: "Slug", name: "slug", widget: "string", hint: "e.g. /book.2024.001" }
                  - { label: "Status", name: "status", widget: "string", default: "Registered" }
                  - { label: "Status Icon", name: "status_icon", widget: "string", default: "bi-check-lg" }
          
          # ---------------- WHAT IS A DOI ----------------
          - label: "What is a DOI"
            name: "what_doi"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string", default: "What is a DOI?" }
              - { label: "Title", name: "title", widget: "string" }
              - label: "Paragraphs" 
                name: "paragraphs"
                widget: "list"
                label_singular: "Paragraph"
                summary: "{{fields.text}}"
                field: { label: "Text", name: "text", widget: "text" }
              - label: "Link 'Learn more about DOI'"
                name: "learn_more"
                widget: "object"
                fields: 
                  - { label: "Text", name: "label", widget: "string", default: "Learn more about DOI" }
                  - { label: "URL", name: "url", widget: "string" }
                  - { label: "Bootstrap Icon", name: "icon", widget: "string", default: "bi-arrow-right-circle" }
              - label: "DOI Example Card (navy)"
                name: "example"
                widget: "object"
                fields:
                  - { label: "Top Label", name: "label", widget: "string", default: "EXAMPLE DOI" }
                  - { label: "Prefix", name: "prefix", widget: "string", hint: "Large orange part, e.g. 10.1392" }
                  - { label: "Suffix", name: "suffix", widget: "string", hint: "White part, e.g. /BC4556.2023.001" }
                  - label: "Legend"
                    name: "legend"
                    widget: "list"
                    label_singular: "Legend Item"
                    summary: "{{fields.label}}"
                    fields:
                      - label: "Dot Color"
                        name: "dot"
                        widget: "select"
                        default: "yellow"
                        options:
                          - { label: "Orange/Yellow", value: "yellow" }
                          - { label: "Blue", value: "blue" }
                      - { label: "Label", name: "label", widget: "string" }
                  - { label: "Resolves to — URL", name: "resolves_url", widget: "string" }
                  - { label: "Standard", name: "standard", widget: "string", default: "ISO 26324 · ANSI/NISO Z39.84" }
          - label: "How it works"
            name: "how_it_works"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Title",  name: "title",   widget: "string" }
              - label: "Step"
                name: "steps"
                widget: "list"
                summary: "{{fields.number}} — {{fields.title}}"
                fields:
                  - { label: "Number", name: "number", widget: "string", default: "01" }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }

          - label: "Partners (horizontal marquee)"
            name: "partners"
            widget: "object"
            fields:
              - { label: "Section Title", name: "title", widget: "string" }
              - label: "Logos / Names"
                name: "items"
                widget: "list"
                label_singular: "Partner"
                summary: "{{fields.name}}"
                fields:
                  - { label: "Name", name: "name", widget: "string" }
                  - { label: "URL (optional)", name: "url", widget: "string", required: false }
  
  - name: "pricing"
    label: "Pricing"
    files:
      - name: "pricing_en"
        label: "English — Pricing"
        file: "data/pricing/en.yaml"
        fields:
          # Header
          - label: "Header section"
            name: "header"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "text" }

          # Startup
          - label: "Startup banner section"
            name: "startup"
            widget: "object"
            fields:
              - { label: "Icon", name: "icon",  widget: "string", default: "bi-rocket-takeoff" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text",  widget: "text" }

          # Main table
          - label: "Main table"
            name: "main_table"
            widget: "object"
            fields:
              - label: "Column headers"
                name: "columns"
                widget: "object"
                fields:
                  - { label: "Bracket", name: "bracket", widget: "string" }
                  - { label: "Annual Fee", name: "fee", widget: "string" }
                  - { label: "Included", name: "included", widget: "string" }
                  - { label: "Excess", name: "excess", widget: "string" }
                  - { label: "Excess — subtitle", name: "excess_sub", widget: "string" }
                  - { label: "CTA Text", name: "cta", widget: "string" }
              
              - label: "Rows"
                name: "rows"
                widget: "list"
                summary: "Bracket {{fields.bracket}} — {{fields.fee}}"
                fields:
                  - { label: "Bracket", name: "bracket", widget: "string" }
                  - { label: "Annual fee", name: "fee", widget: "string" }
                  - { label: "Included", name: "included", widget: "string" }
                  - { label: "Excess price", name: "excess", widget: "string" }
                  - { label: "CTA URL", name: "cta_url", widget: "string" }
                  - { label: "Evidence (popular)", name: "popular", widget: "boolean", default: false }

          # Add-on tables
          - label: "Add-on tables (CrossRef / Similarity Check)"
            name: "addon_tables"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Key (crossref / simcheck)", name: "key", widget: "string",
                  hint: "Use crossref or simcheck to apply the correct palette." }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "text" }
              - { label: "Block notes", name: "note", widget: "text", required: false }
              - label: "Brackets (columns)"
                name: "brackets"
                widget: "list"
                summary: "Bracket {{fields.value}}"
                field: { label: "Value", name: "value", widget: "string" }
              - label: "Rows"
                name: "rows"
                widget: "list"
                summary: "{{fields.label}}"
                fields:
                  - { label: "Row label", name: "label", widget: "string" }

          # Notes
          - label: "Final notes"
            name: "notes"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string", default: "Notes" }
              - label: "Notes"
                name: "items"
                widget: "list"
                summary: "{{fields.note}}"
                field: { label: "Note (Markdown)", name: "note", widget: "text" }

          # CTA
          - label: "Final CTA"
            name: "cta"
            widget: "object"
            fields:
              - { label: "URL",   name: "url",   widget: "string" }
              - { label: "Icon", name: "icon",  widget: "string", default: "bi-envelope-fill" }
              - { label: "Text", name: "label", widget: "string" }
              - { label: "Note (Markdown)", name: "note", widget: "markdown" }

  # TRANSLATION UI
  - name: "i18n"
    label: "Internationalisation"
    files:
      - name: "i18n_it"
        label: "Italiano (i18n)"
        file: "i18n/it.yaml"
        fields:
          - label: "Stringhe"
            name: "strings"
            widget: "list"
            summary: "{{fields.id}} → {{fields.translation}}"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Traduzione", name: "translation", widget: "string" }
      
      - name: "i18n_en"
        label: "English (i18n)"
        file: "i18n/en.yaml"
        fields:
          - label: "Strings"
            name: "strings"
            widget: "list"
            summary: "{{fields.id}} → {{fields.translation}}"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Translation", name: "translation", widget: "string" }
      
      - name: "i18n_de"
        label: "Deutsch (i18n)"
        file: "i18n/de.yaml"
        fields:
          - label: "Strings"
            name: "strings"
            widget: "list"
            summary: "{{fields.id}} → {{fields.translation}}"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Translation", name: "translation", widget: "string" }