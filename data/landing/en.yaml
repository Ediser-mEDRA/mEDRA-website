what_doi:
  eyebrow: "What is a DOI?"
  title: "A permanent link that never breaks"
  paragraphs:
    - "A Digital Object Identifier (DOI) is an ISO-standard persistent identifier that uniquely names any digital or physical intellectual property — books, articles, datasets, images, audio, and more."
    - "Unlike URLs, DOIs remain stable regardless of where the content is moved or hosted. They enable automated copyright management, content discovery, and reliable citation linking."
  learn_more:
    label: "Learn more about DOI"
    url: "#"
    icon: "bi-arrow-right-circle"
  example:
    label: "EXAMPLE DOI"
    prefix: "10.1392"
    suffix: "/BC4556.2023.001"
    legend:
      - { dot: "yellow", label: "Prefix — Registrant identifier" }
      - { dot: "blue",   label: "Suffix — Content identifier" }
    resolves_url: "https://publisher.com/article/BC4556"
    standard: "ISO 26324 · ANSI/NISO Z39.84"

how_it_works:
  eyebrow: "Process"
  title: "How DOI registration works"
  steps:
    - { number: "01", title: "Request an account", description: "Fill out the registration form to create your institutional organization account and administrator profile." }
    - { number: "02", title: "Prepare your metadata", description: "Prepare DOI metadata in the mEDRA XML format for your journal and depositing DOI." }
    - { number: "03", title: "Register a DOI", description: "Submit the prepared DOI metadata and it will be registered and made publicly available." }

