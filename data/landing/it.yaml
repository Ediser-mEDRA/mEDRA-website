what_doi:
  eyebrow: "Cos'è un DOI?"
  title: "Un link permanente che non si rompe mai"
  paragraphs:
    - "Un Digital Object Identifier (DOI) è un identificatore persistente standard ISO che nomina in modo univoco qualsiasi proprietà intellettuale digitale o fisica — libri, articoli, dataset, immagini, audio e altro."
    - "A differenza degli URL, i DOI rimangono stabili indipendentemente da dove viene spostato o ospitato il contenuto. Consentono la gestione automatica del copyright, la scoperta dei contenuti e il collegamento affidabile delle citazioni."
  learn_more:
    label: "Scopri di più sul DOI"
    url: "#"
    icon: "bi-arrow-right-circle"
  example:
    label: "ESEMPIO DOI"
    prefix: "10.1392"
    suffix: "/BC4556.2023.001"
    legend:
      - { dot: "yellow", label: "Prefisso — identificatore del registrante" }
      - { dot: "blue",   label: "Suffisso — identificatore del contenuto" }
    resolves_url: "https://publisher.com/article/BC4556"
    standard: "ISO 26324 · ANSI/NISO Z39.84"

