  text: "Need multiple registrants or unlimited DOI registrations? We offer a tailor-made plan designed for academic institutions."
  cta: "Contact sales"
  cta_url: "mailto:sales@medra.org"

notes:
  title: "Good to know"
  items:
    - "Annual subscription expires on 31/12 each year, with automatic renewal."
    - "Service activated upon advanced payment of the annual fee (plus months of the current year for new contracts)."
    - "You can change DOI Bracket from one year to the next by writing to [sales@medra.org](mailto:sales@medra.org)."
    - "Excess DOIs are invoiced at the beginning of the following year."
    - "Non-automatic renewal has a € 100/year administrative charge."
    - "Discounts apply to backlist content, depending on the number of requested DOIs."

