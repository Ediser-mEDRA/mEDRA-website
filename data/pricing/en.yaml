crossref:
  icon: "bi-journal-bookmark-fill"
  title: "Deposit in Crossref"
  paragraphs:
    - "mEDRA customers also have access to Crossref's services — an international platform dedicated to academic and scientific publishing, designed to increase the visibility and citability of your publications."
    - "Access is subject to an annual fee depending on the DOI band, plus a supplement of **€ 0,75 – € 0,80** per DOI enabled to CR services."
