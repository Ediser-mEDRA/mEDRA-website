header:
  eyebrow: "DOI Registration Service"
  title: "Simple, transparent pricing"
  subtitle: "Choose the DOI bracket that fits your publishing volume. All prices are in Euro, VAT excluded."

startup:
  icon: "bi-rocket-takeoff"
  title: "Startup cost — € 150"
  text: "For the first year, customers have to consider a fee of € 150 as start up cost, comprehensive of technical assistance via e-mail or helpline (by appointment)."

