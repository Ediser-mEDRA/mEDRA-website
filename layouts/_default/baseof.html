<!DOCTYPE html>
<html lang="{{ .Site.Language.LanguageCode }}" dir="{{ or .Site.Language.LanguageDirection `ltr` }}">
  <!--
  <html lang="{{ .Site.LanguageCode | default "it-IT" }}" data-bs-theme="light">
  -->
  <head>
    {{ partial "head.html" . }}
  </head>
  <body>
    {{ partial "backgrounds.html" . }}
    
    <a href="#main-content" class="skip-link">{{ i18n "skip_to_content" }}</a>
    
    <header class="fixed-header" id="fixedHeader">
      {{ partial "topbar.html" . }}
      {{ partial "header.html" . }}
      {{ partial "navbar.html" . }}
    </header>
    
    <main id="main-content">
      {{ block "main" . }}{{ end }}
    </main>

    <footer>
      {{ partial "footer.html" . }}
    </footer>
    {{ partialCached "head/js.html" . }}
  </body>
</html>
