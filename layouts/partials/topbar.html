{{ $topbar := site.Data.site.topbar }}
<div class="topbar" id="topbar">
  <div class="container">
    <a href="mailto:{{ $topbar.email }}" class="topbar-email" aria-label="{{ i18n "topbar_email_aria" }} {{ $topbar.email }}">
      <i class="bi bi-envelope-fill me-2" aria-hidden="true"></i>
      <span>{{ $topbar.email }}</span>
    </a>
    
    <a href="{{ printf "%s" "https://doi.org" }}" class="topbar-email" target="_blank" rel="noopener noreferrer">
      <img src="{{ "images/doi-foundation-removebg-preview.png" | relURL }}" alt="DOI — Foundation" width="100" height="24">
    </a>
    
    <div class="social-links" aria-label="{{ i18n "social_links_aria" }}">
      {{ range $topbar.socials }}
        {{ if .divider }}<span class="topbar-divider" aria-hidden="true"></span>{{ end }}
        <a href="{{ .url }}" class="social-link"
           {{ if .external }}target="_blank" rel="noopener noreferrer"{{ end }}
           aria-label="{{ .key }}">
          <i class="bi {{ .icon }}" aria-hidden="true"></i>
        </a>
      {{ end }}
    </div>
  </div>
</div>
